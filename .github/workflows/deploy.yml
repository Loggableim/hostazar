name: Quality and Cloudflare Pages
on:
  push:
    branches: [main, 'ops/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hostazar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Strict gates
        run: sh deploy.sh
  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage public files only
        run: |
          mkdir _site
          cp ./*.html sitemap.xml feed.xml robots.txt _headers _redirects favicon.ico _site/
          for dir in artikel css js images gaming webhosting ki-llm devops; do
            if [ -d "$dir" ]; then cp -r "$dir" _site/; fi
          done
          if [ -f ads.txt ]; then cp ads.txt _site/; fi
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.45.0 pages deploy _site --project-name hostazar --branch main
