name: AdSense Backfill
on:
  push:
    paths:
      - '.github/workflows/adsense-backfill.yml'
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/adsense-freigabe-2026-11
      - name: Insert AdSense tag where missing
        run: |
          python3 - <<'PY'
          import glob
          tag = '  <script data-hz-src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9094916118868532" crossorigin="anonymous"></script>\n'
          files = ['artikel/cloudflare-r2-vps-backup-2026.html','artikel/docker-swarm-vs-kubernetes-2026.html','artikel/gameserver-ddos-schutz-cloudflare-2026.html','artikel/vps-kubernetes-monitoring-2026.html','artikel/vps-monitoring-alerting-2026.html','artikel/vps-nginx-tuning-2026.html']
          changed = 0
          for p in files:
              s = open(p, encoding='utf-8').read()
              if 'ca-pub-' in s:
                  continue
              if '</head>' not in s:
                  raise SystemExit('no head in ' + p)
              s = s.replace('</head>', tag + '</head>', 1)
              open(p, 'w', encoding='utf-8').write(s)
              changed += 1
          print('changed', changed)
          PY
      - name: Verify all articles carry the tag
        run: |
          missing=$(grep -L 'ca-pub-9094916118868532' artikel/*.html | wc -l)
          echo "Artikel ohne Tag: $missing"
          test "$missing" -eq 0
      - name: Commit and remove this workflow
        run: |
          git config user.name 'Levin (Hostazar)'
          git config user.email 'levin@hostazar.com'
          git rm -q .github/workflows/adsense-backfill.yml
          git add -A
          git commit -m 'fix(adsense): AdSense-Tag auf sechs restlichen Artikeln ergaenzen'
          git push origin HEAD:ops/adsense-freigabe-2026-11
